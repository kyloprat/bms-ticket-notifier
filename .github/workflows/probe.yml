name: probe-district
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch District pages
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36"
          urls = [
            "https://www.district.in/movies/avengers-doomsday-movie-tickets-in-bengaluru-MV176735",
            "https://www.district.in/movies/namit-malhotra-s-ramayana-movie-tickets-in-bengaluru-MV176276",
          ]
          for u in urls:
              req = urllib.request.Request(u, headers={"User-Agent": UA, "Accept-Language": "en-IN,en;q=0.9"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read().decode("utf-8", "replace"); code = r.status
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace"); code = e.code
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', body, re.S)
              sessions = None
              if m:
                  s = m.group(1)
                  sessions = sum(int(x) for x in re.findall(r'"number_of_sessions":\s*(\d+)', s))
              print(u[-40:], "HTTP", code, "len", len(body), "next_data", bool(m), "sessions", sessions)
          PY
